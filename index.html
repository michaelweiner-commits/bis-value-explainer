<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>How the Platform Creates Value</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ---- Salesforce palette (from Salesforce Corporate Template 2026 theme) ---- */
:root{
  --sf-navy:#001E5B; --sf-blue:#022AC0; --sf-cloud:#00B3FF; --sf-sky:#90D0FE;
  --sf-teal:#04E1CB; --sf-gold:#FCC003; --sf-purple:#D17DFE; --sf-tealdark:#0097A7;
  --red:#C0392B; --amber:#B8860B; --amber-soft:#FFF6DC; --green:#1D7324;
  --card:#fff; --border:#e3e9f4; --text:#0b1b3b; --muted:#55638a; --faint:#8795b0;
  --bg:#eef2f9;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; overflow:hidden;
}
#root{height:100vh;display:flex;flex-direction:column;}

/* ---- Header ---- */
.hdr{background:linear-gradient(100deg,var(--sf-navy),var(--sf-blue));color:#fff;
  padding:14px 28px;flex-shrink:0;display:flex;align-items:center;gap:16px;}
.hdr .sf-logo{height:54px;width:auto;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3));}
.hdr h1{font-size:22px;font-weight:700;flex:1;}
.hdr .bis-seal{height:58px;width:auto;flex-shrink:0;background:#fff;border-radius:50%;padding:3px;
  box-shadow:0 1px 4px rgba(0,0,0,.25);}

/* ---- Main stage ---- */
.main{flex:1;display:flex;gap:22px;padding:12px 28px 8px;min-height:0;}
.stage{flex:1;position:relative;min-width:0;}

/* The platform "space" */
.platform{
  position:absolute;inset:0;border-radius:22px;
  background:radial-gradient(120% 90% at 50% 0%, #f5f9ff 0%, #eaf2fd 60%, #e3edfb 100%);
  border:2px solid #cddcf5;
  box-shadow:inset 0 2px 22px rgba(0,30,91,.05), 0 6px 30px rgba(0,30,91,.07);
  display:flex;flex-direction:column;overflow:hidden;
  transition:border-color .5s, box-shadow .5s;
}
.platform.lit{border-color:var(--sf-cloud);box-shadow:inset 0 2px 22px rgba(0,30,91,.05), 0 8px 34px rgba(2,42,192,.14);}

/* AI band — caps the top of the building */
.ai-band{
  border-radius:13px;
  background:linear-gradient(100deg,var(--sf-navy),#5b2a9e 60%,var(--sf-purple));
  color:#fff;display:flex;align-items:center;gap:11px;justify-content:center;
  box-shadow:0 7px 20px rgba(93,42,158,.28);
  opacity:0;transform:translateY(-10px) scaleY(.4);transform-origin:top;
  transition:opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1), height .4s, padding .4s, margin .4s;
  height:0;padding:0 18px;overflow:hidden;margin:0;
}
.ai-band.show{opacity:1;transform:none;height:auto;padding:18px 22px;margin:0 0 3px;overflow:visible;}
.ai-band .astro{flex-shrink:0;height:84px;width:auto;margin:0 8px 0 0;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
.ai-band b{font-size:18px;}
.ai-band span{font-size:13px;color:var(--sf-sky);}

/* ---- the building: grows bottom-up (base first, apps on top, AI caps it) ---- */
.building{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px 24px 14px;min-height:0;}

/* app layers stacked on top of the base */
.app-stack{display:flex;flex-direction:column;gap:7px;}
.applayer{width:100%;min-height:62px;border-radius:12px;color:#fff;display:flex;align-items:center;gap:14px;padding:9px 18px;
  box-shadow:0 5px 14px rgba(0,30,91,.13);
  opacity:0;transform:translateY(18px) scale(.97);transition:opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1);}
.applayer.in{opacity:1;transform:none;}
.applayer .aname{font-weight:800;font-size:15px;width:210px;flex-shrink:0;display:flex;align-items:center;gap:9px;white-space:nowrap;}
.applayer .aname .ico{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:13px;}
.applayer .adesc{flex:1;font-size:13px;color:rgba(255,255,255,.92);}
/* right-side cluster: price + effort, built into the bar */
.applayer .ameta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.applayer .aprice{font-weight:800;font-size:17px;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px;line-height:1;white-space:nowrap;}
.applayer .aprice.q{font-size:18px;min-width:34px;text-align:center;}
.applayer .aeff{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.82);white-space:nowrap;}
.applayer.crm{background:linear-gradient(120deg,var(--sf-blue),var(--sf-cloud));}
.applayer.snap{background:linear-gradient(120deg,var(--sf-tealdark),var(--sf-teal));}
.applayer.cuess{background:linear-gradient(120deg,#7b3fb0,var(--sf-purple));}
.applayer.more{background:rgba(255,255,255,.55);border:1.5px dashed #c4d3ef;box-shadow:none;color:var(--muted);}
.applayer.more .aname{color:var(--faint);}
.applayer.more .adesc{color:var(--faint);}
.applayer.more .aprice{background:#eef3fb;color:var(--amber);}
.applayer.more .aeff{color:var(--faint);}

/* the base: one solid slab the apps snap onto. Clear visual separation from the apps. */
.base-slab{margin-top:10px;border:2px solid #b9cbeb;border-radius:14px;background:#eaf1fb;
  padding:10px 14px 11px;box-shadow:inset 0 2px 10px rgba(0,30,91,.06);
  opacity:0;transition:opacity .5s, border-color .4s, box-shadow .4s;position:relative;}
.base-slab.show{opacity:1;}
.base-slab-head{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sf-blue);
  display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;transition:color .4s;}
.base-slab-head .base-price{color:var(--sf-navy);background:#fff;border:1px solid #c4d3ef;border-radius:22px;
  padding:5px 16px;white-space:nowrap;font-size:19px;letter-spacing:0;text-transform:none;display:inline-flex;align-items:baseline;gap:7px;}
.base-slab-head .base-price .pc{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.base-stack{display:flex;flex-direction:column;gap:4px;}
.baselayer{width:100%;border-radius:9px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--sf-navy);
  display:flex;align-items:center;gap:12px;padding:5px 15px;
  opacity:0;transition:opacity .45s cubic-bezier(.2,.8,.2,1);}
.baselayer.in{opacity:1;}
.baselayer .bk{font-weight:800;font-size:13px;color:var(--sf-navy);min-width:96px;}
.baselayer .bv{flex:1;font-size:12px;color:var(--muted);}
/* when apps reuse it, the whole slab gets a steady highlight — no motion */
.base-slab.reuse{border-color:var(--sf-cloud);box-shadow:inset 0 2px 10px rgba(0,30,91,.06), 0 0 0 3px rgba(0,179,255,.14);}
.base-slab.reuse .base-slab-head{color:var(--sf-tealdark);}

/* ---- Controls ---- */
.controls{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:8px 28px 10px;}
.btn{background:var(--sf-blue);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;
  font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--sf-navy);}
.btn.ghost{background:#fff;color:var(--sf-blue);border:1px solid #c3d2ee;}
.btn.ghost:hover{background:#f3f7ff;}
.btn:disabled{opacity:.38;cursor:default;}
.btn.replay.pulse{animation:btnpulse 1.4s ease-in-out infinite;}
@keyframes btnpulse{0%,100%{box-shadow:0 0 0 0 rgba(2,42,192,.4);}50%{box-shadow:0 0 0 7px rgba(2,42,192,0);}}
.dots{display:flex;gap:8px;margin-left:auto;}
.dot{width:11px;height:11px;border-radius:50%;background:#cdd9ef;border:none;cursor:pointer;padding:0;transition:background .3s, transform .2s;}
.dot:hover{transform:scale(1.2);}
.dot.on{background:var(--sf-blue);} .dot.done{background:var(--sf-sky);}
.progress{flex:1;height:5px;background:#dde6f6;border-radius:4px;overflow:hidden;max-width:220px;}
.progress i{display:block;height:100%;background:var(--sf-cloud);width:0%;}
</style>
</head>

function Astro() {
  return <img className="astro" src={ASTRO_SRC} width="30" height="48" alt="Astro" />;
}

function Stage({ scene }) {
  return (
    <div className="stage">
      <div className={"platform" + (scene.base ? " lit" : "")}>
        <div className={"building" + (scene.reuse ? " reuse" : "")}>

          {/* AI caps the top */}
          <div className={"ai-band" + (scene.ai ? " show" : "")}>
            <Astro />
            <b>AI &amp; Agents</b>
            <span>working across every application</span>
          </div>

          {/* apps stacked on top of the base, newest on top. Each bar carries its own price + effort. */}
          {scene.apps > 0 && (
            <div className="app-stack">
              {scene.apps >= 3 && (
                <div className="applayer more in">
                  <div className="aname">+ more apps</div>
                  <div className="adesc">each built on the same base</div>
                  <div className="ameta"><span className="aeff">App build</span></div>
                </div>
              )}
              {APPS.slice(0, scene.apps).reverse().map((a) => (
                <div key={a.name} className={"applayer in " + a.cls}>
                  <div className="aname"><span className="ico">{a.ico}</span>{a.name}</div>
                  <div className="adesc">{a.desc}</div>
                  <div className="ameta">
                    {a.price !== "?" && <span className="aprice">{a.price}</span>}
                    {a.sub && <span className="aeff">{a.sub}</span>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* the base: one solid foundation the apps snap onto, with its one-time price */}
          <div className={"base-slab" + (scene.base ? " show" : "") + (scene.reuse ? " reuse" : "")}>
            <div className="base-slab-head">
              <span>LICENSE AND FOUNDATION · reused by every app</span>
              <span className="base-price">~$3.5M</span>
            </div>
            <div className={"base-stack" + (scene.base ? " in" : "")}>
              {BASE.map((b, i) => (
                <div key={b.bk} className={"baselayer" + (i >= (BASE.length - scene.base) ? " in" : "")}>
                  <div className="bk">{b.bk}</div>
                  <div className="bv">{b.bv}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  // deep-link: #N jumps to scene N (1-based); #last jumps to the final scene
  const startIdx = (() => {
    const h = (window.location.hash || "").replace("#", "");
    if (h === "last") return SCENES.length - 1;
    const n = parseInt(h, 10);
    return (!isNaN(n) && n >= 1 && n <= SCENES.length) ? n - 1 : 0;
  })();
  const [idx, setIdx] = useState(startIdx);
  const [playing, setPlaying] = useState(startIdx === 0);
  const [done, setDone] = useState(false);
  const [prog, setProg] = useState(0);

  const elapsed = useRef(0);
  const last = useRef(null);
  const raf = useRef(null);

  const scene = SCENES[idx];
  const lastScene = SCENES.length - 1;

  useEffect(() => {
    if (!playing || done) { last.current = null; if (raf.current) cancelAnimationFrame(raf.current); return; }
    const tick = (t) => {
      if (last.current == null) last.current = t;
      const dt = t - last.current; last.current = t;
      elapsed.current += dt;
      const p = Math.min(1, elapsed.current / SCENES[idx].dur);
      setProg(p);
      if (p >= 1) {
        if (idx < lastScene) { elapsed.current = 0; setIdx(v => v + 1); setProg(0); }
        else { setPlaying(false); setDone(true); return; }
      }
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => { if (raf.current) cancelAnimationFrame(raf.current); };
  }, [playing, done, idx, lastScene]);

  const goto = useCallback((n) => {
    elapsed.current = 0; last.current = null; setProg(0); setDone(false);
    setIdx(Math.max(0, Math.min(lastScene, n)));
  }, [lastScene]);

  const replay = useCallback(() => {
    elapsed.current = 0; last.current = null; setProg(0); setIdx(0); setDone(false); setPlaying(true);
  }, []);

  const togglePlay = useCallback(() => {
    if (done) { replay(); return; }
    last.current = null; setPlaying(v => !v);
  }, [done, replay]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === " ") { e.preventDefault(); togglePlay(); }
      else if (e.key === "ArrowRight") goto(idx + 1);
      else if (e.key === "ArrowLeft") goto(idx - 1);
      else if (e.key.toLowerCase() === "r") replay();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [idx, togglePlay, goto, replay]);

  return (
